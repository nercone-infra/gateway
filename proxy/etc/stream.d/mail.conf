# Submission (Mail Proxy)
server {
    listen 127.0.0.1:10025;

    proxy_pass mail.ruconet.internal:10025;
    proxy_timeout 30m;

    proxy_ssl on;
    include /etc/nginx/snippets/ruconet-proxy.conf;
}

# IMAP (Mail Proxy)
server {
    listen 127.0.0.1:10143 proxy_protocol;

    set_real_ip_from 127.0.0.1;

    proxy_pass mail.ruconet.internal:143;
    proxy_protocol on;
    proxy_timeout 30m;

    proxy_ssl on;
    include /etc/nginx/snippets/ruconet-proxy.conf;
}
