worker_processes  auto;

error_log  /var/log/nginx/error.log notice;

http {
    include       /usr/local/share/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    server_names_hash_bucket_size 128;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;
    client_max_body_size 100m;

    keepalive_timeout  65;

    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    map $host $onion_host {
        default                                 ltrywxxoxsz25t7voax2i3nyihhkwerxyyxq7qrpteagtdyqdybetuqd.onion;
        "~^(?<service>git|pds|mx)\." ${service}.ltrywxxoxsz25t7voax2i3nyihhkwerxyyxq7qrpteagtdyqdybetuqd.onion;
    }

    upstream gitea_backend {
        server gitea.ruconet.internal:443;
        keepalive 16;
    }

    upstream bluesky_backend {
        server pds.ruconet.internal:443;
        keepalive 16;
    }

    upstream roundcube_backend {
        server mail.ruconet.internal:443;
        keepalive 16;
    }

    upstream rspamd_backend {
        server mail.ruconet.internal:11334;
        keepalive 4;
    }

    upstream auth_backend {
        server mail.ruconet.internal:10080;
        keepalive 4;
    }

    upstream website_backend {
        server website.ruconet.internal:443;
        keepalive 16;
    }

    include /etc/nginx/http.d/*.conf;
}
